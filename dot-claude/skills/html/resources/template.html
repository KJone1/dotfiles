<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='50' font-size='52' text-anchor='middle'%3E{{ICON}}%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --color-canvas: #f8efe7;
      --color-surface: #fdf7f3;
      --color-hairline: #ccc5bf;
      --color-hairline-soft: #ece5df;
      --color-ink: #2c232e;
      --color-body: #72696d;
      --color-muted: #92898a;
      --color-primary: #b16803;
      --color-primary-hover: #8f5402;
      --color-success: #27a657;
      --color-success-bg: color-mix(in srgb, #27a657 10%, #fdf7f3);
      --color-success-fg: #669f59;
      --color-warning: #d3b020;
      --color-warning-bg: color-mix(in srgb, #d3b020 12%, #fdf7f3);
      --color-warning-fg: #a48819;
      --color-warning-text: color-mix(in srgb, #a48819 55%, #2c232e);
      --color-error: #e06c76;
      --color-error-bg: color-mix(in srgb, #e06c76 10%, #fdf7f3);
      --color-error-fg: #d36151;
      --color-info: #2473b6;
      --color-info-bg: color-mix(in srgb, #2473b6 10%, #fdf7f3);
      --color-row-hover: #2c232e0c;
      --color-pre-bg: #ece5df;
      --color-pre-fg: #2c232e;

      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;

      --shadow-sm: 0 1px 2px rgba(44, 35, 46, 0.05);
      --shadow-card: 0 4px 12px rgba(44, 35, 46, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-canvas);
      color: var(--color-body);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-hairline);
      display: flex;
      align-items: center;
      padding: 0 32px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--color-ink);
    }

    /* Layout */
    .container {
      width: 94%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 0 80px;
    }

    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

    /* Section switcher */
    .top-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; }
    .switcher { position: relative; display: flex; align-items: center; gap: 6px; }
    .sw-arrow, .sw-btn {
      appearance: none; font: inherit; cursor: pointer; color: var(--color-ink);
      background: var(--color-surface); border: 1px solid var(--color-hairline); border-radius: var(--radius-md);
      height: 38px; display: inline-flex; align-items: center; transition: background 160ms ease;
    }
    .sw-arrow { width: 38px; justify-content: center; padding: 0; }
    .sw-arrow:disabled { opacity: .35; cursor: default; }
    .sw-btn { gap: 10px; padding: 0 14px; min-width: 360px; font-size: 15px; font-weight: 600; }
    .sw-arrow:not(:disabled):hover, .sw-btn:hover { background: var(--color-hairline-soft); }
    .sw-arrow:focus-visible, .sw-btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .sw-pos { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--color-muted); }
    .sw-caret { margin-left: auto; display: flex; transition: transform 160ms ease; }
    .switcher.open .sw-caret { transform: rotate(180deg); }
    .sw-menu {
      position: absolute; top: 46px; left: 44px; width: 420px; max-height: 70vh; overflow-y: auto; z-index: 50;
      background: var(--color-surface); border: 1px solid var(--color-hairline); border-radius: var(--radius-lg);
      box-shadow: 0 12px 32px rgba(44, 35, 46, 0.14); padding: 6px;
    }
    .sw-menu[hidden] { display: none; }
    .sw-item {
      appearance: none; border: 0; background: none; font: inherit; text-align: left; cursor: pointer; width: 100%;
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-md);
      color: var(--color-ink); font-size: 14px; font-weight: 600;
    }
    .sw-item:hover, .sw-item.kb { background: var(--color-hairline-soft); }
    .sw-item.on { background: color-mix(in srgb, var(--color-primary) 12%, transparent); }
    .sw-item .n { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--color-muted); width: 20px; }
    body.single-tab .switcher { display: none; }

    .tab-panel {
      background: var(--color-surface);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 28px 32px;
    }

    .tab-panel[hidden] { display: none; }
    .tab-panel > :first-child { margin-top: 0; }

    /* Core Primitives */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: 18px 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 12.5px;
      font-weight: 600;
      background: var(--color-hairline-soft);
      color: var(--color-muted);
    }

    .badge-primary { background: color-mix(in srgb, var(--color-primary) 12%, transparent); color: var(--color-primary); }
    .badge-success { background: var(--color-success-bg); color: var(--color-success-fg); }
    .badge-warning { background: var(--color-warning-bg); color: var(--color-warning-fg); }
    .badge-error { background: var(--color-error-bg); color: var(--color-error-fg); }

    /* Tables */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin: 16px 0;
      font-size: 15px;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-hairline);
      border-right: 1px solid var(--color-hairline);
      text-align: left;
      vertical-align: top;
    }

    th:last-child, td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }

    th {
      background: var(--color-hairline-soft);
      font-weight: 600;
      color: var(--color-ink);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    tr:hover td { background: var(--color-row-hover); }

    /* Typography & Code */
    h2, h3, h4 { color: var(--color-ink); margin: 16px 0 8px; }
    p { margin-bottom: 12px; }
    ul, ol { margin: 8px 0 12px 20px; }
    li { margin-bottom: 6px; }

    code {
      font-family: var(--font-mono);
      font-size: 13.5px;
      background: var(--color-hairline-soft);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      color: var(--color-ink);
    }

    pre {
      background: var(--color-pre-bg);
      color: var(--color-pre-fg);
      font-family: var(--font-mono);
      font-size: 13.5px;
      padding: 16px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin: 12px 0;
      line-height: 1.5;
    }

    pre code { background: none; color: inherit; padding: 0; }

    /* Callouts */
    .callout {
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border-left: 4px solid var(--color-info);
      background: var(--color-info-bg);
      margin: 12px 0;
    }

    .callout-success { border-color: var(--color-success); background: var(--color-success-bg); color: var(--color-success-fg); }
    .callout-warning { border-color: var(--color-warning); background: var(--color-warning-bg); color: var(--color-warning-text); }
    .callout-error   { border-color: var(--color-error);   background: var(--color-error-bg);   color: var(--color-error-fg); }
  </style>
</head>
<body>

  <header class="top-nav">
    <h1 class="page-title" id="doc-title">{{TITLE}}</h1>
    <div class="switcher" id="switcher"></div>
  </header>

  <main class="container" id="content-root">
    <section class="tab-panel" data-title="Section Title">
      <!-- Section content -->
    </section>
  </main>

  <script>
    (() => {
      const panels = [...document.querySelectorAll('.tab-panel')];
      const sw = document.getElementById('switcher');
      const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      const chev = d => `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      if (panels.length < 2) { document.body.classList.add('single-tab'); panels.forEach(p => p.hidden = false); return; }

      panels.forEach(p => { p.id ||= slug(p.dataset.title); p.setAttribute('role', 'region'); p.setAttribute('aria-label', p.dataset.title); });
      sw.innerHTML = `
        <button class="sw-arrow" id="sw-prev" aria-label="Previous section">${chev('M10 4l-4 4 4 4')}</button>
        <button class="sw-btn" id="sw-btn" aria-haspopup="listbox"><span class="sw-pos" id="sw-pos"></span><span id="sw-title"></span><span class="sw-caret">${chev('M4 6l4 4 4-4')}</span></button>
        <button class="sw-arrow" id="sw-next" aria-label="Next section">${chev('M6 4l4 4-4 4')}</button>
        <div class="sw-menu" id="sw-menu" role="listbox" hidden>${panels.map((p, i) =>
          `<button class="sw-item" role="option" data-i="${i}"><span class="n">${i + 1}</span>${esc(p.dataset.title)}</button>`).join('')}</div>`;

      const menu = document.getElementById('sw-menu'), items = [...menu.children];
      const prev = document.getElementById('sw-prev'), next = document.getElementById('sw-next');
      let current = 0, kb = -1;

      function paintKb() { items.forEach((x, j) => x.classList.toggle('kb', j === kb)); items[kb]?.scrollIntoView({ block: 'nearest' }); }
      function openMenu() { sw.classList.add('open'); menu.hidden = false; kb = current; paintKb(); }
      function closeMenu() { sw.classList.remove('open'); menu.hidden = true; kb = -1; paintKb(); }

      function show(i) {
        current = i;
        panels.forEach((p, j) => p.hidden = j !== i);
        document.getElementById('sw-pos').textContent = `${i + 1} / ${panels.length}`;
        document.getElementById('sw-title').textContent = panels[i].dataset.title;
        prev.disabled = i === 0;
        next.disabled = i === panels.length - 1;
        items.forEach((x, j) => { x.classList.toggle('on', j === i); x.setAttribute('aria-selected', j === i); });
        history.replaceState(null, '', '#' + panels[i].id);
        window.scrollTo(0, 0);
        window.dispatchEvent(new CustomEvent('tabshown', { detail: panels[i] }));
      }
      const step = d => { const n = current + d; if (n >= 0 && n < panels.length) show(n); };

      document.getElementById('sw-btn').addEventListener('click', ev => { ev.stopPropagation(); menu.hidden ? openMenu() : closeMenu(); });
      items.forEach(x => x.addEventListener('click', () => { closeMenu(); show(+x.dataset.i); }));
      prev.addEventListener('click', () => step(-1));
      next.addEventListener('click', () => step(1));
      document.addEventListener('click', ev => { if (!sw.contains(ev.target)) closeMenu(); });

      document.addEventListener('keydown', e => {
        if (e.target.closest('input, textarea, select, [contenteditable]')) return;
        if (!menu.hidden) {
          if (e.key === 'ArrowDown') kb = Math.min(kb + 1, items.length - 1);
          else if (e.key === 'ArrowUp') kb = Math.max(kb - 1, 0);
          else if (e.key === 'Enter') { e.preventDefault(); const g = kb; closeMenu(); show(g); return; }
          else if (e.key === 'Escape') { closeMenu(); return; }
          else return;
          e.preventDefault(); paintKb(); return;
        }
        if (e.key === 'ArrowRight') step(1);
        else if (e.key === 'ArrowLeft') step(-1);
        else if (e.key === 'g') { e.preventDefault(); openMenu(); }
      });

      const fromHash = panels.findIndex(p => '#' + p.id === location.hash);
      show(fromHash >= 0 ? fromHash : 0);
    })();
  </script>
</body>
</html>
