<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='50' font-size='52' text-anchor='middle'%3E{{ICON}}%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --color-canvas: #f8efe7;
      --color-surface: #fdf7f3;
      --color-hairline: #ccc5bf;
      --color-hairline-soft: #ece5df;
      --color-ink: #2c232e;
      --color-body: #72696d;
      --color-muted: #92898a;
      --color-primary: #b16803;
      --color-primary-hover: #8f5402;
      --color-success: #27a657;
      --color-success-bg: color-mix(in srgb, #27a657 10%, #fdf7f3);
      --color-success-fg: #669f59;
      --color-warning: #d3b020;
      --color-warning-bg: color-mix(in srgb, #d3b020 12%, #fdf7f3);
      --color-warning-fg: #a48819;
      --color-warning-text: color-mix(in srgb, #a48819 55%, #2c232e);
      --color-error: #e06c76;
      --color-error-bg: color-mix(in srgb, #e06c76 10%, #fdf7f3);
      --color-error-fg: #d36151;
      --color-info: #2473b6;
      --color-info-bg: color-mix(in srgb, #2473b6 10%, #fdf7f3);
      --color-row-hover: #2c232e0c;
      --color-pre-bg: #ece5df;
      --color-pre-fg: #2c232e;

      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;

      --shadow-sm: 0 1px 2px rgba(44, 35, 46, 0.05);
      --shadow-card: 0 4px 12px rgba(44, 35, 46, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-canvas);
      color: var(--color-body);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-hairline);
      display: flex;
      align-items: center;
      padding: 0 32px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--color-ink);
    }

    /* Layout */
    .container {
      width: 94%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 0 80px;
    }

    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

    /* Tabs */
    .tab-bar {
      position: sticky;
      top: 64px;
      z-index: 19;
      display: flex;
      padding: 10px 32px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-hairline);
      overflow-x: auto;
    }

    .tab-track {
      display: inline-flex;
      gap: 2px;
      margin-inline: auto;
      padding: 4px;
      background: var(--color-hairline-soft);
      border-radius: var(--radius-lg);
    }

    .tab {
      appearance: none;
      border: 0;
      background: none;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--color-muted);
      padding: 6px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .tab:hover { color: var(--color-ink); background: #2c232e0c; }
    .tab:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

    .tab[aria-selected="true"] {
      color: var(--color-ink);
      background: var(--color-surface);
      box-shadow: 0 1px 3px rgba(44, 35, 46, 0.12), 0 0 0 1px var(--color-hairline);
    }

    .tab-panel {
      background: var(--color-surface);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 28px 32px;
    }

    .tab-panel[hidden] { display: none; }
    .tab-panel > :first-child { margin-top: 0; }
    body.single-tab .tab-bar { display: none; }

    /* Core Primitives */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: 18px 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 12.5px;
      font-weight: 600;
      background: var(--color-hairline-soft);
      color: var(--color-muted);
    }

    .badge-primary { background: color-mix(in srgb, var(--color-primary) 12%, transparent); color: var(--color-primary); }
    .badge-success { background: var(--color-success-bg); color: var(--color-success-fg); }
    .badge-warning { background: var(--color-warning-bg); color: var(--color-warning-fg); }
    .badge-error { background: var(--color-error-bg); color: var(--color-error-fg); }

    /* Tables */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin: 16px 0;
      font-size: 15px;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-hairline);
      border-right: 1px solid var(--color-hairline);
      text-align: left;
      vertical-align: top;
    }

    th:last-child, td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }

    th {
      background: var(--color-hairline-soft);
      font-weight: 600;
      color: var(--color-ink);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    tr:hover td { background: var(--color-row-hover); }

    /* Typography & Code */
    h2, h3, h4 { color: var(--color-ink); margin: 16px 0 8px; }
    p { margin-bottom: 12px; }
    ul, ol { margin: 8px 0 12px 20px; }
    li { margin-bottom: 6px; }

    code {
      font-family: var(--font-mono);
      font-size: 13.5px;
      background: var(--color-hairline-soft);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      color: var(--color-ink);
    }

    pre {
      background: var(--color-pre-bg);
      color: var(--color-pre-fg);
      font-family: var(--font-mono);
      font-size: 13.5px;
      padding: 16px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin: 12px 0;
      line-height: 1.5;
    }

    pre code { background: none; color: inherit; padding: 0; }

    /* Callouts */
    .callout {
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border-left: 4px solid var(--color-info);
      background: var(--color-info-bg);
      margin: 12px 0;
    }

    .callout-success { border-color: var(--color-success); background: var(--color-success-bg); color: var(--color-success-fg); }
    .callout-warning { border-color: var(--color-warning); background: var(--color-warning-bg); color: var(--color-warning-text); }
    .callout-error   { border-color: var(--color-error);   background: var(--color-error-bg);   color: var(--color-error-fg); }
  </style>
</head>
<body>

  <header class="top-nav">
    <h1 class="page-title" id="doc-title">{{TITLE}}</h1>
  </header>
  <nav class="tab-bar"><div class="tab-track" id="tab-bar" role="tablist"></div></nav>

  <main class="container" id="content-root">
    <section class="tab-panel" data-title="Section Title">
      <!-- Section content -->
    </section>
  </main>

  <script>
    (() => {
      const panels = [...document.querySelectorAll('.tab-panel')];
      const bar = document.getElementById('tab-bar');
      const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (panels.length < 2) { document.body.classList.add('single-tab'); return; }

      const tabs = panels.map((p, i) => {
        p.id ||= slug(p.dataset.title);
        p.setAttribute('role', 'tabpanel');
        const b = document.createElement('button');
        b.className = 'tab';
        b.setAttribute('role', 'tab');
        b.textContent = p.dataset.title;
        b.onclick = () => show(i);
        bar.appendChild(b);
        return b;
      });

      let current = 0;
      function show(i) {
        current = i;
        panels.forEach((p, j) => p.hidden = j !== i);
        tabs.forEach((t, j) => { t.setAttribute('aria-selected', j === i); t.tabIndex = j === i ? 0 : -1; });
        tabs[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
        history.replaceState(null, '', '#' + panels[i].id);
        window.scrollTo(0, 0);
      }

      document.addEventListener('keydown', e => {
        if (e.target.closest('input, textarea, select, [contenteditable]')) return;
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        const next = (current + (e.key === 'ArrowRight' ? 1 : -1) + panels.length) % panels.length;
        show(next);
        if (document.activeElement?.classList.contains('tab')) tabs[next].focus();
      });

      const fromHash = panels.findIndex(p => '#' + p.id === location.hash);
      show(fromHash >= 0 ? fromHash : 0);
    })();
  </script>
</body>
</html>
