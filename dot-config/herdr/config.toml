onboarding = false

[ui]
status_indicators = "symbols"

[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    { token = "state_text", rules = [
      { starts_with = "blocked", fg = "#FF5D62", bold = true },
      { starts_with = "working", fg = "#E6C384" },
      { starts_with = "done", fg = "#98BB6C", bold = true },
      { starts_with = "idle", hide = true },
      { starts_with = "unknown", dim = true },
    ] },
    "machine",
    "workspace",
    "terminal_title_stripped",
    "tab",
  ],
  ["agent"],
]

