# Tokyo Night
include current-theme.conf

# The default value of . means to use whatever shell is set as the default shell for the current user
shell .
# The default value of . means to use the environment variables VISUAL and EDITOR in that order
editor .

#-----------------------------------------------------------
#-- General
#-----------------------------------------------------------
enable_audio_bell         false
copy_on_select            yes
confirm_os_window_close   0
paste_actions             quote-urls-at-prompt,confirm
select_by_word_characters @-./_~?&=%+#
shell_integration         no-title no-cursor
update_check_interval     0

#-----------------------------------------------------------
#-- Font
#-----------------------------------------------------------
font_family      family='JetBrainsMono Nerd Font Mono' style=Medium
bold_font        auto
italic_font      auto
bold_italic_font auto
modify_font      cell_height 120%
font_size        18.0

#-----------------------------------------------------------
#-- Mouse
#-----------------------------------------------------------
cursor_shape           block
cursor_blink_interval  0
cursor_shape_unfocused hollow
mouse_hide_wait        3.0

#-----------------------------------------------------------
#-- Tab bar
#-----------------------------------------------------------
tab_bar_edge top
tab_bar_style separator
tab_separator "  ┇  "
tab_bar_align center
tab_title_template "{tab.active_wd.rsplit('/', 1)[-1] or '/'}"

#-----------------------------------------------------------
#-- MACOS Keyboard shortcuts
#-----------------------------------------------------------
map cmd+t new_tab_with_cwd
map cmd+] next_tab
map cmd+[ previous_tab
map cmd+shift+l next_tab
map cmd+shift+h previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

#-----------------------------------------------------------
#-- Linux Keyboard shortcuts
#-----------------------------------------------------------
map alt+t new_tab_with_cwd
map alt+] next_tab
map alt+[ previous_tab
map alt+shift+l next_tab
map alt+shift+h previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
