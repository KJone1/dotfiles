"$schema" = 'https://starship.rs/config-schema.json'

continuation_prompt = "[  ](dimmed white)"
add_newline = false

format = """\
$directory\
$status\
$git_branch $character"""

[directory]
style = "bold"
use_os_path_sep = true
format = '\[[$path]($style)\]'

[package]
disabled = true

[git_branch]
format = '  [$branch]($git_status)'

[status]
format = '\[[$status]($style)\]'
style = "bold red"
disabled = false

[character]
format = " "
